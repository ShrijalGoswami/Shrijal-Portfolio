          - paragraph [ref=e34]: "I'm a B.Tech CS student (AI & ML specialization) at VIT Bhopal, and the pattern in everything I build is the same: take a result that works in a notebook and make it inspectable, measurable, and deployable. Dense retrieval that misses exact keywords gets a sparse BM25 partner. A classifier that overfits gets stacked under a cross-validated meta-learner. A model that can't explain itself gets source attribution."
          - paragraph [ref=e35]: Right now that means interning at Pinnacle Labs — writing modular Python AI components behind FastAPI backends and tuning retrieval weights against real latency budgets — plus open-source contribution through GSSoC '26 and a finalist run at the DataForge hackathon.
