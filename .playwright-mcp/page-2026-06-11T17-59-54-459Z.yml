        - generic [ref=e93]:
          - paragraph [ref=e94]: "I'm a B.Tech CS student (AI & ML specialization) at VIT Bhopal, and the pattern in everything I build is the same: take a result that works in a notebook and make it inspectable, measurable, and deployable. Dense retrieval that misses exact keywords gets a sparse BM25 partner. A classifier that overfits gets stacked under a cross-validated meta-learner. A model that can't explain itself gets source attribution."
          - paragraph [ref=e95]: Right now that means working as an AI Strategist at AKademy38, an Australia-based EdTech startup — where I rebuilt their manual AI booklet-generation workflow into a structured pipeline that cut token usage roughly 10× per booklet (≈40% → ≈4%) while keeping output consistent at scale. That role grew out of an AI/ML internship at Pinnacle Labs, where I shipped Python AI components behind FastAPI backends and tuned retrieval against real latency budgets — plus open-source contribution through GSSoC '26 and a finalist run at the DataForge hackathon.
        - paragraph [ref=e97]: "What I bring to a team: practical ML (Scikit-learn, XGBoost), retrieval/LLM plumbing (LangChain, ChromaDB, Groq, Vertex AI), and the FastAPI engineering to put both behind an endpoint that doesn't fall over."
